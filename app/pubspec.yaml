name: papersync
description: Live ink from a paper notebook.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.3.2
  pdf: ^3.11.3
  printing: ^5.14.2
  uuid: ^4.5.1
  web: ^1.1.1
  flutter_blue_plus: ^2.3.13
  permission_handler: ^13.0.2
  flutter_secure_storage: ^11.0.0
  hive_ce: ^2.20.0
  path_provider: ^2.1.6
  supabase_flutter: ^2.9.1
  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
